<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyHealthWord</title>
    <link rel="stylesheet" href="styles.css?v=5">
  </head>
  <body>
    <main>
      <h1>MyHealthWord</h1>
      <p class="intro">Describe a symptom in your own words.</p>

      <form id="search-form" role="search">
        <label for="search-input">Symptom</label>
        <div class="search-row">
          <input id="search-input" type="search" placeholder="Type a symptom" autocomplete="off" autofocus>
          <button type="submit">Search</button>
        </div>
        <div id="language-picker" hidden>
          <label for="target-language">Which language would you like?</label>
          <input id="target-language" type="text" list="language-options" placeholder="Start typing a language" autocomplete="off" aria-describedby="language-help">
          <datalist id="language-options"></datalist>
          <p id="language-help">Choose a language, then select Translate.</p>
          <button id="translate-button" type="button">Translate</button>
        </div>
      </form>

      <div class="browse-actions">
        <button id="browse-all" type="button">Browse all</button>
        <button id="feeling-lucky" type="button">I'm feeling lucky</button>
      </div>

      <section id="results" aria-live="polite"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="app.js?v=12"></script>
  </body>
</html>
